name: GTDCraft
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
# team, bundle IDs and App Group: Config/Base.xcconfig, overridden by the git-ignored Config/Local.xcconfig (./setup.sh)
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  GTDCraft:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Placeholder
      - path: Assets.xcassets
    dependencies:
      - target: GTDCraftWidgets
      - target: GTDCraftShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GTD_BUNDLE_ID)"
        PRODUCT_NAME: GTDCraft
        MARKETING_VERSION: "0.18.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the Rust binary is the app; the Swift stub only exists so Xcode has something to link
        ONLY_ACTIVE_ARCH: YES
    entitlements:
      path: GTDCraft.entitlements
      properties:
        # shared with the widget and Share extension: the app's sync server URL and token (free accounts allow one)
        com.apple.security.application-groups: ["$(GTD_APP_GROUP)"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GTDCraft
        GTDAppGroup: "$(GTD_APP_GROUP)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSCalendarsFullAccessUsageDescription: GTDCraft shows your Calendar events in Forecast.
        NSLocationWhenInUseUsageDescription: GTDCraft uses your location to show nearby places and send location reminders.
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        # gtdcraft://pair?server=…&token=… — the Mac's Settings › Sync QR code opens here
        CFBundleURLTypes:
          - CFBundleURLName: "$(GTD_BUNDLE_ID).pair"
            CFBundleURLSchemes: [gtdcraft]
        NSLocalNetworkUsageDescription: GTDCraft syncs with the sync server on your Mac over your network.
    postCompileScripts:
      - name: Embed the Rust binary
        shell: /bin/sh
        script: |
          set -e
          cd "$SRCROOT/.."
          cargo build --release --target aarch64-apple-ios --bin gtdcraft
          cp target/aarch64-apple-ios/release/gtdcraft "$CODESIGNING_FOLDER_PATH/gtdcraft"
          chmod +x "$CODESIGNING_FOLDER_PATH/gtdcraft"
          echo "embedded $(wc -c < "$CODESIGNING_FOLDER_PATH/gtdcraft") bytes of Rust at $CODESIGNING_FOLDER_PATH/gtdcraft"

  GTDCraftWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GTD_BUNDLE_ID).widgets"
        PRODUCT_NAME: GTDCraftWidgets
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.18.1"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/GTDCraftWidgets.entitlements
      properties:
        # shared with the widget and Share extension: the app's sync server URL and token (free accounts allow one)
        com.apple.security.application-groups: ["$(GTD_APP_GROUP)"]
    info:
      path: Widgets/Info.plist
      properties:
        GTDAppGroup: "$(GTD_APP_GROUP)"
        CFBundleDisplayName: GTDCraft Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  GTDCraftShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GTD_BUNDLE_ID).share"
        PRODUCT_NAME: GTDCraftShare
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.18.1"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: ShareExtension/GTDCraftShare.entitlements
      properties:
        # shared with the widget and Share extension: the app's sync server URL and token (free accounts allow one)
        com.apple.security.application-groups: ["$(GTD_APP_GROUP)"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: GTDCraft
        GTDAppGroup: "$(GTD_APP_GROUP)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionActivationRule:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
