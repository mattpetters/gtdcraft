# iOS 27's UIKit refuses to launch apps built against its SDK unless they adopt the UIScene life cycle (TN3187),
# and winit 0.30 (under eframe) doesn't. Recording an older SDK version in the binary keeps the classic life cycle.
# ponytail: remove once eframe/winit adopt UIScene.
[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-Wl,-platform_version,ios-simulator,17.0,18.5"]

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-platform_version,ios,17.0,18.5"]
